<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8E1F3A">
<title>Shubha Yatra - wedding card route planner</title>
<meta name="description" content="Add the homes you need to visit with wedding cards. Get the shortest order, so you never drive back and forth.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app">
  <section id="mapwrap" class="mapwrap" aria-label="Map">
    <div id="map"></div>
    <div id="pinhint" class="pinhint" hidden>Tap the map to add a stop</div>
  </section>
  <main id="panel" class="panel">
    <div id="view"></div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<dialog id="pastedlg" class="dlg">
  <form method="dialog" id="pasteform">
    <h2>Paste addresses</h2>
    <p class="muted">One home per line. Add a name first if you like: <code>Ramesh uncle | 4th Cross, Vidyanagar</code></p>
    <label for="pastetext" class="sr">Addresses</label>
    <textarea id="pastetext" rows="9" spellcheck="false" placeholder="Ramesh uncle | 4th Cross, Vidyanagar&#10;Sunita aunty | Gokul Road&#10;Keshwapur Main Road"></textarea>
    <p id="pastestatus" class="muted" aria-live="polite"></p>
    <div class="row">
      <button type="button" class="btn ghost" id="pastecancel">Close</button>
      <button type="button" class="btn primary grow" id="pastego">Add all</button>
    </div>
  </form>
</dialog>

<script src="js/solver.js"></script>
<script src="js/maps.js"></script>
<script src="js/app.js"></script>
</body>
</html>
